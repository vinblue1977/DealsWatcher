<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="--bg:#0B0D10;--surface:#14181D;--surface2:#1C2128;--line:#262C34;--text:#ECEEF1;--muted:#98A1AD;--accent:#FFB224;--good:#3DD68C;--warn:#F5C451;--bad:#FF8A7A;width:390px;height:844px;box-sizing:border-box;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="flex:1;min-height:0;padding:64px 20px 0;display:flex;flex-direction:column;gap:16px">
    <h1 style="margin:0;font-size:34px;line-height:40px;font-weight:700;letter-spacing:-0.02em">Settings</h1>

    <div style="background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="flex:none;width:40px;height:40px;border-radius:10px;background:rgba(61,214,140,0.14);display:flex;align-items:center;justify-content:center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:16px;font-weight:600">Notifications are on</div>
          <div style="font-size:13px;color:var(--muted);margin-top:2px">This iPhone · Home Screen app</div>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button type="button" style="flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:15px;font-weight:600">Send a test</button>
        <button type="button" style="flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--bad);font-size:15px;font-weight:600">Turn off</button>
      </div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--line);border-radius:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 14px">
        <div>
          <div style="font-size:15px">Quiet hours</div>
          <div style="font-size:13px;color:var(--muted);margin-top:1px">No alerts, they arrive at the end</div>
        </div>
        <span style="font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px">10 PM – 7 AM
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#98A1AD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em">Appearance</div>
      <div role="radiogroup" aria-label="Appearance" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <button role="radio" aria-checked="true" type="button" style="height:68px;border-radius:14px;border:2px solid var(--accent);background:var(--surface);color:var(--text);font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Dark</button>
        <button role="radio" aria-checked="false" aria-disabled="true" type="button" style="height:68px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light<span style="font-size:11px">Coming soon</span></button>
        <button role="radio" aria-checked="false" aria-disabled="true" type="button" style="height:68px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Auto<span style="font-size:11px">Coming soon</span></button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em">Store status</div>
      <div style="background:var(--surface);border:1px solid var(--line);border-radius:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 14px;border-bottom:1px solid var(--line);font-size:15px"><span>Best Buy</span><span style="display:inline-flex;align-items:center;gap:6px;color:var(--good);font-size:13px;font-weight:600"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Working</span></div>
        <div style="display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 14px;border-bottom:1px solid var(--line);font-size:15px"><span>Target</span><span style="display:inline-flex;align-items:center;gap:6px;color:var(--good);font-size:13px;font-weight:600"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Working</span></div>
        <div style="display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 14px;font-size:15px"><span>Walmart</span><span style="display:inline-flex;align-items:center;gap:6px;color:var(--warn);font-size:13px;font-weight:600"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2L12 3zM12 10v5M12 18h.01"/></svg>Blocked, retrying</span></div>
      </div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--line);border-radius:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 14px">
        <span style="font-size:15px">Signed in with a passkey</span>
        <button type="button" style="min-height:44px;padding:0;border:0;background:transparent;color:var(--bad);font-size:15px;font-weight:600">Sign out</button>
      </div>
    </div>
  </div>

  <nav aria-label="Main" style="flex:none;height:84px;box-sizing:border-box;padding:8px 8px 0;background:var(--surface);border-top:1px solid var(--line);display:flex;position:relative">
    <a href="Main.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500;padding-top:4px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Watching</a>
    <a href="Deals.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500;padding-top:4px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>Deals</a>
    <a href="Keywords.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500;padding-top:4px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></svg>Keywords</a>
    <a href="Settings.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--accent);font-size:11px;font-weight:600;padding-top:4px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Settings</a>
    <div style="position:absolute;left:128px;bottom:8px;width:134px;height:5px;border-radius:3px;background:rgba(236,238,241,0.4)"></div>
  </nav>
</div>
</x-dc>

</html>
