name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 13 * * 1"  # weekly, so new advisories against current dependency versions fail `make audit`
  workflow_dispatch:

# Least privilege by default.
permissions:
  contents: read

# Superseded PR runs are cancelled; each run on main gets its own group so none is dropped while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A push to main is always a merged PR (branch protection) that was up to date with main, so checks and
# workflow-lint skip pushes; the deploy re-runs only the audit, which catches advisories published since the PR.
jobs:
  # Decides whether checks and workflow-lint run: always on schedule and manual runs; on a PR only if something
  # besides docs (docs/ or top-level Markdown) changed. GitHub counts a skipped required job as passed.
  scope:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 5
    outputs:
      run_checks: ${{ steps.diff.outputs.run_checks }}
      deps_changed: ${{ steps.diff.outputs.deps_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        run: |
          if [ "$EVENT" != pull_request ]; then printf 'run_checks=true\ndeps_changed=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          # --no-renames: a code file moved into docs/ shows as deleted from its old path, so it counts as code.
          changed="$(git diff --name-only --no-renames "$BASE...$HEAD")"
          echo "$changed"
          code="$(grep -Ev '^(docs/|[^/]+\.md$)' <<<"$changed" || true)"
          echo "run_checks=$([ -z "$changed" ] || [ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Python packages only change with the requirements files; the weekly run and every deploy still audit.
          echo "deps_changed=$(grep -qE '(^|/)requirements[^/]*\.(txt|in)$' <<<"$changed" && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  # Three parallel jobs; `checks` (the required status) passes only if all of them pass.
  python:
    needs: scope
    if: needs.scope.outputs.run_checks == 'true'
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            requirements*.txt
            layer/requirements.txt
      - name: Install Python dependencies (uv; --seed keeps pip in the venv)
        run: |
          uv venv --seed --python "$(which python)" .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements-dev.txt
          uv pip install --python .venv/bin/python --require-hashes --no-deps -r layer/requirements.txt  # what ships
          uv pip check --python .venv/bin/python
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm  # pyright and the CDK CLI, keyed on package-lock.json
      - name: Install pyright and the CDK CLI (exact versions; no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Personal-data guard (public repo)
        run: make privacy
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}  # private names to block; never printed
      - name: Lint (ruff with Bandit security rules, pyright types)
        run: make lint
      - name: Unit and infrastructure tests (parallel)
        run: make test

  frontend:
    needs: scope
    if: needs.scope.outputs.run_checks == 'true'
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the PWA's tools (exact versions; no install scripts)
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: ESLint, types, Vitest, build, 150 KB size limit
        run: make frontend
      - name: Vulnerability audit of shipped packages
        run: npm audit --prefix frontend --omit=dev --audit-level=high

  synth:
    needs: scope
    if: needs.scope.outputs.run_checks == 'true'
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            requirements*.txt
            layer/requirements.txt
      - name: Install Python dependencies (uv; --seed keeps pip in the venv)
        run: |
          uv venv --seed --python "$(which python)" .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements-dev.txt
          uv pip install --python .venv/bin/python --require-hashes --no-deps -r layer/requirements.txt  # what ships
          uv pip check --python .venv/bin/python
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm  # pyright and the CDK CLI, keyed on package-lock.json
      - name: Install pyright and the CDK CLI (exact versions; no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependency vulnerability audit (when requirements change; weekly and on deploy regardless)
        if: needs.scope.outputs.deps_changed == 'true'
        run: make audit
      - name: Synthesize and run cdk-nag security checks (stand-in app files)
        run: make synth SITE_DIR=tests/fixtures/site LAYER_DIR=tests/fixtures/layer

  checks:
    needs: [scope, python, frontend, synth]
    # Not on cancelled runs (a newer push supersedes them), so they don't show a misleading failure.
    if: ${{ !cancelled() && needs.scope.outputs.run_checks == 'true' }}
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 2
    steps:
      - name: All checks passed
        run: |
          echo "python=$PY frontend=$FE synth=$SY"
          [ "$PY" = success ] && [ "$FE" = success ] && [ "$SY" = success ]
        env:
          PY: ${{ needs.python.result }}
          FE: ${{ needs.frontend.result }}
          SY: ${{ needs.synth.result }}

  # Lints the workflow files: actionlint (syntax, expressions, shell) and zizmor (Actions security).
  workflow-lint:
    needs: scope
    if: needs.scope.outputs.run_checks == 'true'
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        # The release binary, checked against its published SHA-256 before it runs.
        run: |
          curl -sSfLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          # One GitHub annotation per finding (the line break inside the quotes ends each one).
          # shellcheck disable=SC2016  # $err is actionlint's template variable, not a shell one
          ./actionlint -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}
          {{end}}'
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e  # v0.7.1
        with:
          inputs: .github
          version: "1.30.1"
          advanced-security: false  # findings as PR annotations, not uploaded to code scanning
          annotations: true

  # Fails a PR that adds a dependency with a known high-severity vulnerability.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high

